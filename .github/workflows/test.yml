name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  sorter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sort-photos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Step 1: CPU-only torch/torchvision from the PyTorch index (pinned, same as requirements.txt)
      - run: python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      # Step 2: the project and its remaining pinned dependencies from PyPI
      - run: python -m pip install -e ".[dev]"
      - run: photo-sorter --help && python -m cafe_sorter --help   # console script and module entry point
      - run: python -m pytest
